name: build

on:
  push:
    branches: [ release-src, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SHSHCheckerWin/SHSHCheckerWin.csproj

      - name: Build
        run: dotnet build SHSHCheckerWin/SHSHCheckerWin.csproj -c Release --no-restore

      - name: Publish (sanity check)
        run: >
          dotnet publish SHSHCheckerWin/SHSHCheckerWin.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHSHCheckerI4-${{ github.sha }}
          path: out/SHSHCheckerI4.exe
          if-no-files-found: error
