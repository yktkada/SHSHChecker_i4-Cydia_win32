name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.8.0), must already exist'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish 4 variants
        shell: pwsh
        run: |
          $proj = 'SHSHCheckerWin/SHSHCheckerWin.csproj'
          $common = @('-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', '-p:DebugType=None', '-p:DebugSymbols=false')

          # 中文 · 框架依赖（~600 KB，推荐）
          dotnet publish $proj @common --self-contained false -o out/zh-fd
          # 中文 · 自包含（免装运行时，压缩后 ~50 MB）
          dotnet publish $proj @common --self-contained true -p:EnableCompressionInSingleFile=true -o out/zh-sc
          # 英文精简版 · 框架依赖（推荐）
          dotnet publish $proj @common --self-contained false -p:EnglishBuild=true -o out/en-fd
          # 英文精简版 · 自包含
          dotnet publish $proj @common --self-contained true -p:EnableCompressionInSingleFile=true -p:EnglishBuild=true -o out/en-sc

          New-Item -ItemType Directory -Force out/files | Out-Null
          Copy-Item out/zh-fd/SHSHCheckerI4.exe        out/files/SHSHCheckerI4.exe
          Copy-Item out/zh-sc/SHSHCheckerI4.exe        out/files/SHSHCheckerI4-selfcontained.exe
          Copy-Item out/en-fd/SHSHCheckerI4-en.exe     out/files/SHSHCheckerI4-en.exe
          Copy-Item out/en-sc/SHSHCheckerI4-en.exe     out/files/SHSHCheckerI4-en-selfcontained.exe
          Get-ChildItem out/files | ForEach-Object { '{0}  {1:N0} bytes' -f $_.Name, $_.Length }

      - name: Checksums & version
        id: meta
        shell: pwsh
        run: |
          $lines = foreach ($f in Get-ChildItem out/files -Filter *.exe) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            "$($f.Name)  SHA256:$hash  $($f.Length) bytes"
          }
          $lines | Out-File -Encoding utf8 out/files/SHA256SUMS.txt
          $exe = Get-Item out/files/SHSHCheckerI4.exe
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.tag }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($exe.VersionInfo.FileVersion)" >> $env:GITHUB_OUTPUT

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          SHSH Checker — Windows builds (Chinese + English)

          | File | Size | Requires | Recommended |
          |---|---|---|---|
          | ``SHSHCheckerI4.exe`` | ~600 KB | .NET 10 Desktop Runtime | ⭐ **recommended** |
          | ``SHSHCheckerI4-selfcontained.exe`` | ~50 MB | nothing | |
          | ``SHSHCheckerI4-en.exe`` | ~600 KB | .NET 10 Desktop Runtime | ⭐ **recommended** |
          | ``SHSHCheckerI4-en-selfcontained.exe`` | ~50 MB | nothing | |

          Download the small (few hundred KB) build unless you cannot install the runtime.
          Runtime: https://dotnet.microsoft.com/download/dotnet/10.0 → Desktop Runtime 10.x → Windows x64

          ## Features

          - **Chinese build**: full version — i4 + Cydia query, download, modern ``.shsh2``, SHSH upload to i4
          - **English build (`-en`)**: legacy 32-bit devices only (A4–A6X, iOS 11 and earlier), Cydia query + download
            (keeps i4 download path, drops i4 query and SHSH upload; iPhone 5c excluded)

          Both builds save ``.shsh`` / ``.shsh2`` and keep the same device catalog and UI.

          ## Notes

          - Unsigned binary; SmartScreen may warn on first run.
          - Legacy (iOS 11 and earlier) SHSH may be trimmed by the i4 server — always keep your local originals.
          - Third-party services may change or break at any time.

          License: GPL-3.0-or-later (source in this repository)

          Version: ${{ steps.meta.outputs.version }}
          "@ | Out-File -Encoding utf8 RELEASE_NOTES.md

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" `
            out/files/SHSHCheckerI4.exe `
            out/files/SHSHCheckerI4-selfcontained.exe `
            out/files/SHSHCheckerI4-en.exe `
            out/files/SHSHCheckerI4-en-selfcontained.exe `
            out/files/SHA256SUMS.txt `
            --title "SHSH Checker ${{ steps.meta.outputs.tag }}" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
